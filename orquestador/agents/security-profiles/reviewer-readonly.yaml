schema: hebrinex.agent_security_profile
version: "0.1"
id: reviewer-readonly
filesystem:
  read: declared_only
  write: deny
commands:
  allowed_risk_classes: [read_only, local_validation]
network: deny
secrets: deny
git_remote: deny
escalation: deny
special_rules:
  no_direct_edits: true
  no_review_own_work: true
