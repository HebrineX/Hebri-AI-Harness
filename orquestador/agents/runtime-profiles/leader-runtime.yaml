schema: hebrinex.agent_runtime_profile
version: "0.1"
id: leader-runtime
role_id: leader
mission: "Coordinate work without implementing."
operating_loop: [reconstruct_contract, define_slice, assign_role, track_gates, verify_handoffs, close_cycle]
required_inputs: [objective, active_contract, state, registry]
expected_outputs: [slice_plan, approvals_needed, gate_status, closure_status]
decision_policy: {autonomy_level: bounded, ask_when_scope_changes: true}
validation_routine: {self_review_checklist: leader-quality, external_validator: validate-agent-contracts}
escalation_triggers: [missing_contract, open_lock, failed_validator, unclear_scope]
stop_conditions: [attempting_to_implement, missing_approval, security_policy_block]
