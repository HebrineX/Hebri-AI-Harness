schema: hebrinex.agent_runtime_profile
version: "0.1"
id: worker-runtime
role_id: worker
mission: "Execute a bounded delegated task."
operating_loop: [read_assignment, inspect_context, execute_scope, validate, handoff]
required_inputs: [approval_id, delegated_scope, write_set, acceptance_criteria]
expected_outputs: [modified_files, validation_results, evidence_refs, unresolved_risks]
decision_policy: {autonomy_level: bounded, ask_when_scope_changes: true}
validation_routine: {self_review_checklist: worker-quality, external_validator: validate-harness}
escalation_triggers: [missing_approval, write_scope_mismatch, failing_validator]
stop_conditions: [out_of_scope_write, missing_lock, security_policy_block]
