schema: hebrinex.portability.adapter_matrix
version: "0.1"
harness_version: "0.16.0"
# hook_support/maturity/role_agents investigados 2026-07-05 (fuentes en
# orquestador/sdd/specs/adapter-investigation-2026-07.md). Prohibido "unknown":
# check-adapter-drift.ps1 falla si reaparece.
hosts:
  - adapter_id: claude-code
    persistent_instruction_file: CLAUDE.md
    hook_support: session_start,user_prompt_submit,pre_tool_use,pre_compact,stop
    subagents: real_role_subagents
    maturity: production
    role_agents: native_subagents_or_mcp_daemon
  - adapter_id: codex
    persistent_instruction_file: AGENTS.md
    hook_support: yes
    subagents: simulated
    maturity: production
    role_agents: via_mcp_daemon
  - adapter_id: gemini
    persistent_instruction_file: GEMINI.md_or_AGENTS.md
    hook_support: limited
    subagents: simulated
    maturity: experimental
    role_agents: via_mcp_daemon
  - adapter_id: cursor
    persistent_instruction_file: .cursor/rules/hebrinex.mdc
    hook_support: yes
    subagents: simulated
    maturity: experimental
    role_agents: via_mcp_daemon
  - adapter_id: copilot
    persistent_instruction_file: .github/copilot-instructions.md
    hook_support: no
    subagents: none_or_simulated
    maturity: experimental
    role_agents: via_mcp_daemon
  - adapter_id: qwen
    persistent_instruction_file: QWEN.md
    hook_support: yes
    subagents: simulated
    maturity: experimental
    role_agents: via_mcp_daemon
  - adapter_id: deepseek
    persistent_instruction_file: host_prompt_or_skills
    hook_support: no
    subagents: simulated
    maturity: experimental
    role_agents: prompt_simulation
  - adapter_id: generic-ai
    persistent_instruction_file: AGENTS.md_or_manual_prompt
    hook_support: not_applicable
    subagents: none_or_simulated
    maturity: production
    role_agents: prompt_simulation
required_entrypoints: [first_message, reentry_light, reentry_full, debug_log_intake, compactation_recovery]
required_invariants:
  - memory_reliability_untrusted_for_evidence
  - preflight_required_before_effects
  - no_infohebri
  - no_complete_memory_by_default
  - explicit_role_simulation_if_needed