schema: hebrinex.schema.migration_registry
version: "0.1"
target: orquestador/migration/migration-registry.yaml
required_top_keys:
  - schema
  - version
  - harness_version
  - status
  - authority
  - supported_targets
  - routes
  - required_contracts
  - required_report_template
  - required_validators
  - preserve_by_default
  - rules
required_values:
  schema: hebrinex.migration_registry
  harness_version: "0.10.10"
  check_only_writes: false
  apply_requires_backup: true
required_routes:
  - 0.9.0-to-0.10.0
  - 0.8.10-to-0.10.0
hard_rules:
  - CheckOnly writes false.
  - Apply requires verified backup before first write.
  - Migration preserves binding, state, registry, cycles, locks, approvals and memory.
  - Applied migration requires post-migration contract and validator evidence.
