blockers:
  - id: P00-B01
    status: resolved_for_p00
    summary: "P00-D21 makes PROJECT_BINDING.yaml and HARNESS_VERSION authoritative for this source repository; stale bound memory metadata remains a later correction."
  - id: P00-B02
    status: open
    summary: "state.schema.yaml contains literal `n sequences; correction is outside P00-T01."
  - id: P00-B03
    status: open
    summary: "SHARED_MANIFEST is declarative, but bootstrap/update still enumerate the legacy structural manifest."
  - id: P00-B04
    status: open
    summary: "Instance mapping is duplicated across PowerShell, CLI and MCP; agent-runtime and migrate-harness still use flat root joins."
  - id: P00-B05
    status: open
    summary: "The stable CLI validator does not positively execute every public dispatcher path or operational Apply branch."
  - id: P00-B06
    status: open
    summary: "Several write-capable CLI branches do not accept or validate ApprovalId; external procedural enforcement is not runtime proof."
  - id: P00-B07
    status: open
    summary: "MCP imports zod directly but receives it only through the SDK transitive dependency; offline payload closure is unproven."
  - id: P00-B08
    status: open
    summary: "MCP ROOT and assumed role are process-global, so one resident process cannot yet isolate multiple project contexts."
  - id: P00-B09
    status: open
    summary: "The default claude-cli role backend is unavailable on the current host; automatic fallback is not proven."
  - id: P00-B10
    status: open
    summary: "Windows client build 10.0.26200 x64 with pwsh 7.6.5 is only a local validation candidate; clean/offline VM and MSI evidence are not_run."
  - id: P00-B11
    status: open
    summary: "PowerShell runtime bundling/prerequisite and minimum supported version are unresolved; the Windows PowerShell 5.1 aggregate attempt exposed a validator stderr-capture incompatibility."
  - id: P00-B12
    status: open
    summary: "API line 1 and hebrinex.binding schema version 1 are accepted design boundaries, but canonical schema implementation, negative fixtures and compatibility tests are not_run."
  - id: P00-B13
    status: open
    summary: "No payload, latency, catalog-throughput or concurrency performance limit is accepted until owners freeze and execute representative workloads."
  - id: P00-B14
    status: open
    summary: "The observed legacy binding declares harness 0.17.1 while project-binding.schema.yaml requires 0.17.0, so the legacy-intact executable fixture lacks a consistent validity oracle."
  - id: P00-B15
    status: open
    summary: "P00-T07 used a simulated same-process reviewer; independent-process review required for R18 product release remains not_run."
