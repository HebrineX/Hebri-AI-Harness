schema: hebrinex.schema.progress_state
version: "0.2"
target: orquestador/sdd/progress/state.yaml
required_top_keys:
  - schema
  - version
  - updated_at
  - mode
  - project_binding
  - session_contract
  - active_cycle
  - required_gates
  - conditional_gates
  - approvals
  - verification
  - open_locks
  - open_agents
  - last_final_report
required_values:
  schema: hebrinex.progress.state
required_gates:
  - G0_session_contract
  - G0A_memory_registry_loaded
  - G1_context_ready
  - G2_dispatch_ready
  - G5I_memory_consistency_complete
  - G6_agent_closure_complete
hard_rules:
  - No declarar done con open_agents u open_locks.
  - No declarar done sin gate log, evidencia, verification si aplica y closure.
  - No usar memoria conversacional como evidencia.
  - full_context_load requiere approval.