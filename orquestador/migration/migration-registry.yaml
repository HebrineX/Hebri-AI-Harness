schema: hebrinex.migration_registry
version: "0.1"
harness_version: "0.14.0"
status: active
authority:
  migration_definition: harness_only
  ai_may_define_migration_routes: false
  check_only_writes: false
  apply_requires_backup: true
supported_targets:
  - "0.10.0"
  - "0.10.x"
  - "0.11.0"
  - "0.12.0"
  - "0.11.x"
  - "0.13.0"
  - "0.13.1"
  - "0.14.0"
  - "0.12.x"
routes:
  - id: "0.13.0-to-0.14.0"
    source_version: "0.13.0"
    target_version: "0.14.0"
    route_file: orquestador/migration/versions/0.13.0-to-0.14.0.yaml
    supported_binding_modes: [bound, source_template]
  - id: "0.13.0-to-0.13.1"
    source_version: "0.13.0"
    target_version: "0.13.1"
    route_file: orquestador/migration/versions/0.13.0-to-0.13.1.yaml
    supported_binding_modes: [bound, source_template]
  - id: "0.12.0-to-0.13.0"
    source_version: "0.12.0"
    target_version: "0.13.0"
    route_file: orquestador/migration/versions/0.12.0-to-0.13.0.yaml
    supported_binding_modes: [bound, source_template]
  - id: "0.9.0-to-0.10.0"
    source_version: "0.9.0"
    target_version: "0.10.0"
    route_file: orquestador/migration/versions/0.9.0-to-0.10.0.yaml
    supported_binding_modes: [bound, source_template]
  - id: "0.8.10-to-0.10.0"
    source_version: "0.8.10"
    target_version: "0.10.0"
    route_file: orquestador/migration/versions/0.8.10-to-0.10.0.yaml
    supported_binding_modes: [bound]
  - id: "0.11.0-to-0.12.0"
    source_version: "0.11.0"
    target_version: "0.12.0"
    route_file: orquestador/migration/versions/0.11.0-to-0.12.0.yaml
    supported_binding_modes: [bound, source_template]
  - id: "0.10.11-to-0.11.0"
    source_version: "0.10.11"
    target_version: "0.11.0"
    route_file: orquestador/migration/versions/0.10.11-to-0.11.0.yaml
    supported_binding_modes: [bound, source_template]
  - id: "bound-update-source-template-to-bound"
    source_version: "0.10.x"
    target_version: "0.11.x"
    route_file: scripts/hebrinex.ps1
    supported_binding_modes: [bound]
    check_only: true
    apply: true
    preserves:
      - PROJECT_BINDING.yaml
      - orquestador/sdd/progress/
      - orquestador/memory/local/
      - orquestador/memory/project/
      - orquestador/migration/reports/
  - id: "bound-restore-from-backup"
    source_version: "0.10.x"
    target_version: "0.11.x"
    route_file: scripts/hebrinex.ps1
    supported_binding_modes: [bound]
    check_only: true
    apply: true
    requires_backup_id: true
    deletes_extra_files: false
  - id: "bound-backup-inventory"
    source_version: "0.10.x"
    target_version: "0.11.x"
    route_file: scripts/hebrinex.ps1
    supported_binding_modes: [bound]
    check_only: true
    apply: false
    writes: false
    validates_backup_integrity: true
required_contracts:
  post_migration_contract: orquestador/migration/contracts/post-migration-contract.yaml
required_report_template: orquestador/migration/reports/migration-report.template.yaml
required_validators:
  - scripts/validate-agent-contracts.ps1
  - scripts/validate-security-policy.ps1
  - scripts/validate-migration.ps1
  - scripts/validate-bound-update.ps1
  - scripts/validate-bound-backups.ps1
  - scripts/validate-bound-restore.ps1
  - scripts/validate-state-machine.ps1
  - scripts/validate-agent-runtime.ps1
  - scripts/audit-harness.ps1
preserve_by_default:
  - PROJECT_BINDING.yaml
  - HARNESS_VERSION
  - orquestador/sdd/progress/state.yaml
  - orquestador/sdd/progress/registry.yaml
  - orquestador/sdd/progress/cycles/
  - orquestador/sdd/progress/locks/
  - orquestador/sdd/progress/approvals/
  - orquestador/memory/local/
  - orquestador/memory/project/
  - orquestador/evidence/
rules:
  - "CheckOnly no escribe archivos."
  - "Apply requiere backup verificado antes del primer write."
  - "Una migracion aplicada termina con contrato post-migracion activo y validadores OK."
  - "0.11.0 exige state machine y agent runtime enforcement activos."
  - "La migracion no ejecuta codigo remoto."
