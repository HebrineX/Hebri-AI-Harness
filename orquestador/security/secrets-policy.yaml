schema: hebrinex.security.secrets_policy
version: "0.1"
harness_version: "0.10.10"
default: deny
secret_bearing_paths:
  - ".env"
  - "*.env"
  - "*.key"
  - "*.pem"
  - "*.pfx"
  - "*credentials*"
  - "*token*"
redaction:
  marker: "[REDACTED]"
  required_before_chat: true
  required_before_report: true
patterns:
  - name: generic_api_key
    regex: "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
  - name: bearer_token
    regex: "(?i)bearer\\s+[a-z0-9._\\-]+"
failure_mode:
  secret_detected_in_output: block_and_redact
  secret_path_requested_without_approval: block
