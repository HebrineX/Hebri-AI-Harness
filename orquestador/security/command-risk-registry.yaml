schema: hebrinex.security.command_risk_registry
version: "0.1"
harness_version: "0.17.3"
defaults:
  unknown_command: block
  string_built_shell_from_untrusted_input: block
  command_output_requires_redaction: true
risk_classes:
  read_only:
    effect: none
    requires_human_si: false
  local_validation:
    effect: local_command
    requires_preflight: true
    requires_evidence: true
  write:
    effect: filesystem_write
    requires_preflight: true
    requires_human_si: true
    requires_write_scope: true
    requires_operation_safety_contract: true
  destructive:
    effect: destructive_filesystem
    requires_preflight: true
    requires_human_si: true
    requires_backup_or_recovery: true
  network:
    effect: external_network
    requires_preflight: true
    requires_human_si: true
    requires_allowlist: true
  git_remote:
    effect: remote_repo
    requires_preflight: true
    requires_human_si: true
  secrets:
    effect: secret_access
    requires_preflight: true
    requires_human_si: true
    requires_redaction: true
  privileged:
    effect: elevated_execution
    requires_preflight: true
    requires_human_si: true
# Rate limit del gateway: ventana deslizante sobre ejecuciones -Apply permitidas
# (CheckOnly es clasificacion pura y no se limita; los blocks no consumen cupo).
# Apply persiste estado en orquestador/runtime/gateway-rate.json y debe declarar
# writes=true. En central_instance esa mutacion requiere operation-safety/1.
rate_limit:
  apply_max_per_window: 30
  window_seconds: 60
blocked_patterns:
  - "Invoke-Expression"
  - "iex"
  - "curl |"
  - "iwr |"
  - "rm -rf"
  - "Remove-Item -Recurse -Force"
  - "git push"
  - "git reset --hard"
safe_patterns:
  - "Get-Content"
  - "Select-String"
  - "Test-Path"
  - "Get-ChildItem"
  - "git status --short"
# Native scoped nonsecret reads need neither SI, approval envelope nor Gateway.
# Gateway safe_patterns/rate_limit above remain unchanged and restricted.
# Hook autoallow is deliberately narrower than the native read-only policy.
host_read_only:
  enabled: true
host_read_only_commands:
  - "Microsoft.PowerShell.Management\Get-Content"
  - "Microsoft.PowerShell.Management\Get-ChildItem"
  - "Microsoft.PowerShell.Management\Test-Path"
  - "Microsoft.PowerShell.Management\Get-Item"
# Exact flags are enforced by the platform AST classifier, not prefix matching.
# Each command requires one -LiteralPath; only Get-Content also accepts -Raw.
# Bash/Git, aliases, recursion, pipelines, redirections and code constructs defer.
# Existing paths must remain inside caller ProjectRoot with no reparse ancestor.
host_read_only_secret_globs:
  - ".env.*"
  - "*.p12"
  - "*.crt"
  - "*secret*"
  - "*password*"
  - "*apikey*"
  - "*private*"
